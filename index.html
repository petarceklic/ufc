<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta name="apple-mobile-web-app-title" content="UFC">
<!-- Deploy note: serve a 180x180 dark PNG at /apple-touch-icon.png for the home screen icon -->
<title>UFC</title>
<style>
  :root{
    --bg:#0B0C0D; --surface:#131517; --line:#22262A;
    --text:#E9E7E2; --dim:#8B9096; --faint:#565B61;
    --live:#FF4633; --win:#58E08A;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;border-radius:0;-webkit-tap-highlight-color:transparent}
  html{background:var(--bg) !important}
  html,body{min-height:100vh}
  #app{background:var(--bg);min-height:100vh}
  body{
    font-family:var(--mono);background:var(--bg) !important;color:var(--text);
    font-size:15px;line-height:1.4;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  header{
    background:var(--bg);
    border-bottom:1px solid var(--line);padding:14px 16px 12px;
  }
  .hdr-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  h1{font-size:16px;font-weight:700;letter-spacing:.02em;text-transform:uppercase}
  .venue{color:var(--dim);font-size:12px;margin-top:3px}
  .maintime{color:var(--dim);font-size:12px;margin-top:6px}
  .maintime b{color:var(--text);font-weight:700}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

  main{padding:0 0 48px}
  .section-label{
    font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);
    padding:20px 16px 8px;
  }
  .section-label.now{color:var(--live)}
  .section-label.next{color:var(--text)}

  /* rail + rows */
  .fight{
    display:flex;gap:0;border-bottom:1px solid var(--line);background:var(--bg);
  }
  .fight.now{background:var(--surface)}
  .rail{
    width:40px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;
    padding-top:18px;position:relative;
  }
  .rail::before{
    content:"";position:absolute;top:0;bottom:0;left:50%;width:1px;background:var(--line);
  }
  .node{
    position:relative;z-index:1;width:9px;height:9px;background:var(--bg);
    border:1px solid var(--faint);
  }
  .fight.done .node{background:var(--faint);border-color:var(--faint)}
  .fight.now .node{background:var(--live);border-color:var(--live);animation:pulse 1.4s ease-in-out infinite}
  @media (prefers-reduced-motion:reduce){.fight.now .node{animation:none}}
  .fight.next .node{border-color:var(--text)}
  .fight.seg-main .rail::before{background:rgba(217,169,63,.45)}
  .fight.seg-main .node{border-color:#D9A93F}
  .fight.seg-main.done .node{background:#8A6C28;border-color:#8A6C28}
  .fight.seg-early .rail::before{background:#191C1F}
  .fight.seg-early .node{border-color:#3A4046}
  .fight.now .node{background:var(--live) !important;border-color:var(--live) !important}
  .fight.next .node{border-color:var(--text) !important}
  .segmark{display:flex;background:var(--bg)}
  .segmark .rail{padding-top:0;min-height:26px}
  .segmark .tick{position:relative;z-index:1;width:5px;height:5px;background:var(--faint);margin-top:11px}
  .segmark.seg-main .rail::before{background:rgba(217,169,63,.45)}
  .segmark.seg-main .tick{background:#D9A93F}
  .segmark.seg-early .rail::before{background:#191C1F}
  .segmark .seglabel{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);align-self:center}
  .segmark.seg-main .seglabel{color:#D9A93F}

  .fbody{flex:1;padding:14px 16px 16px 4px;min-width:0}
  .fmeta{display:flex;justify-content:space-between;gap:8px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-bottom:2px}
  .fmeta>span:last-child{text-align:right}
  .fmeta .wc{color:var(--dim)}
  .fmeta .tag-main{color:#D9A93F}
  .fmeta .tag-next{color:var(--text);font-weight:700}
  .fmeta .tag-live{color:var(--live)}
  .eta{color:#D9A93F}
  .evcard{cursor:pointer}
  .evcard:active{background:#191C1F}
  .evlabel{font-size:15px;font-weight:700;line-height:1.3;padding:2px 0}
  .evtime{font-size:11px;color:var(--faint);padding-top:2px}
  .vsrow{display:grid;grid-template-columns:1fr 34px 1fr;align-items:center;gap:4px;padding:8px 0 0}
  .corner{display:flex;flex-direction:column;align-items:center;text-align:center;gap:5px;min-width:0}
  .headshot{width:64px;height:64px;background:#1B1E21;overflow:hidden;flex-shrink:0;position:relative;border-radius:50%}
  .headshot .ini{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:16px;letter-spacing:.06em;color:var(--faint)}
  .headshot img{position:relative;width:100%;height:100%;object-fit:cover;object-position:top;display:block;background:#23272B}
  .vsmid{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);text-align:center}
  .fight.done .vsmid{color:var(--win);font-size:12px}
  .fname{font-size:13px;font-weight:400;line-height:1.25;max-width:100%;overflow:hidden;text-overflow:ellipsis}
  .frec{font-size:10px;color:var(--faint)}
  .fodds{font-size:10px;letter-spacing:.06em;color:var(--faint)}
  .fodds .lbl{letter-spacing:.12em;text-transform:uppercase;font-size:9px}
  .fodds.fav{color:var(--dim)}
  .fprob{margin-left:5px;color:var(--text);font-weight:700}
  .fodds.dog .fprob{color:var(--dim);font-weight:400}
  .corner.won .fname{color:var(--win);font-weight:700}
  .corner.won .headshot{box-shadow:inset 0 0 0 2px var(--win)}
  .corner.lost{opacity:.45}
  .corner.lost .headshot img{filter:grayscale(1)}
  .fight.done .corner.won .fname::after{content:" ✓"}
  .result{font-size:11px;color:var(--dim);margin-top:10px;letter-spacing:.04em;text-align:center}
  .cliplinks{display:flex;gap:8px;margin-top:10px;justify-content:center;align-items:center}
  .cliplinks a{
    font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--dim);text-decoration:none;border:1px solid var(--line);
    padding:8px 12px;min-height:34px;display:inline-flex;align-items:center;
  }
  .cliplinks a:active{border-color:var(--dim);color:var(--text)}

  .empty{padding:18px 16px;color:var(--faint);font-size:12px}
  .navbtn{
    flex-shrink:0;background:none;border:1px solid var(--line);color:var(--dim);
    font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    padding:6px 10px;min-height:32px;cursor:pointer;
  }
  .navbtn:active{border-color:var(--text);color:var(--text)}
  .refresh{
    display:block;width:calc(100% - 32px);margin:28px 16px 0;padding:10px;
    background:none;border:1px solid var(--line);color:var(--dim);
    font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;
  }
  .refresh:active{border-color:var(--text);color:var(--text)}
  .footnote{padding:16px;color:var(--faint);font-size:10px;letter-spacing:.04em;line-height:1.6}
</style>
</head>

function normName(s){
  return String(s||"").normalize("NFKD").replace(/[̀-ͯ]/g,"").toLowerCase()
    .replace(/\b(jr|sr|ii|iii)\b\.?/g,"").replace(/[^a-z ]/g," ").replace(/\s+/g," ").trim();
}
function surname(s){const p=normName(s).split(" ");return p[p.length-1]||"";}
function buildOddsIndex(){
  oddsIndex={};
  for(const f of (odds&&odds.fights)||[]){
    oddsIndex[normName(f.a)+"|"+normName(f.b)]=f;
    oddsIndex[surname(f.a)+"|"+surname(f.b)]=oddsIndex[surname(f.a)+"|"+surname(f.b)]||f;
  }
}
function oddsFor(a,b){
  if(!oddsIndex) return null;
  let f=oddsIndex[normName(a)+"|"+normName(b)]; if(f) return {a:f.oa,b:f.ob};
  f=oddsIndex[normName(b)+"|"+normName(a)]; if(f) return {a:f.ob,b:f.oa};
  f=oddsIndex[surname(a)+"|"+surname(b)]; if(f) return {a:f.oa,b:f.ob};
  f=oddsIndex[surname(b)+"|"+surname(a)]; if(f) return {a:f.ob,b:f.oa};
  return null;
}
function fmtOdds(n){return (n>0?"+":"−")+Math.abs(n);}
// American odds -> implied probability. Books build in a margin ("vig"), so the two
// raw probabilities sum past 100%; normalising against the pair strips it out and
// gives the market's actual read on the fight.
function impliedProb(o){return o==null?null:(o>0?100/(o+100):(-o)/((-o)+100));}
function devig(a,b){
  const pa=impliedProb(a), pb=impliedProb(b);
  if(pa==null||pb==null) return null;
  const t=pa+pb;
  if(!(t>0)) return null;
  return {a:pa/t, b:pb/t};
}

    const ath=c.athlete||{};
    const aid=ath.id||c.id; // live scoreboard carries the athlete id on the competitor, not the athlete

      winner:!!c.winner,

  });
}
function state(f){
  const cs=f.competitors||[];
  if(cs.some(c=>c.winner)) return "post";
  return (f.status&&f.status.type&&f.status.type.state)||"pre";
}
function harvestCalendar(data){

function ymd(iso){
  const d=new Date(iso);
  return d.getUTCFullYear()+String(d.getUTCMonth()+1).padStart(2,"0")+String(d.getUTCDate()).padStart(2,"0");
}
// One header button, top right: it swaps between the card and the upcoming list.
function setNav(label, fn){
  const b=document.getElementById("navBtn");
  if(!b) return;
  b.textContent=label;
  b.setAttribute("onclick", fn+"()");
}
function backToCard(){
  view="event";            // keep state honest: loadOdds re-renders only on the card
  if(lastData) render(lastData,lastLive,false); else load();
}
function renderUpcoming(){
  view="upcoming"; browsing=false;
  setNav("Card", "backToCard");
  const app=document.getElementById("app");
  document.getElementById("evName").textContent="Upcoming events";
  document.getElementById("evVenue").textContent="";
  document.getElementById("evMain").textContent="";
  const now=Date.now();
  const future=calendarLive.filter(e=>!/contender series/i.test(e.label)&&new Date(e.date).getTime()>now-6*3600e3).slice(0,10);
  let html='<div class="section-label">Next · '+future.length+'</div>';
  future.forEach(e=>{
    const isPPV=/UFC \d/.test(e.label);
    html+='<div class="fight evcard" onclick="openEvent(\''+e.id+'\',\''+ymd(e.date)+'\')">'
      +'<div class="rail"><div class="node"></div></div>'
      +'<div class="fbody">'
      +'<div class="fmeta"><span class="wc">'+(isPPV?'<span class="tag-main">PPV</span>':'Fight night')+'</span><span>'+esc(localDay(e.date))+'</span></div>'
      +'<div class="evlabel">'+esc(e.label)+'</div>'
      +'<div class="evtime">'+esc(localTime(e.date))+' your time</div>'
      +'</div></div>';
  });
  html+='<div class="footnote">Tap an event for the full card. Detail needs the live feed; in Snapshot mode ESPN can\'t be reached.</div>';
  app.innerHTML=html;
}
async function openEvent(id,dateStr){
  const app=document.getElementById("app");
  app.innerHTML='<div class="empty">Loading card…</div>';
  try{
    const ctrl=new AbortController();
    const t=setTimeout(()=>ctrl.abort(),6000);
    /* ESPN keys ?dates= on the event's local day and the event date is the prelim start,
       so a 00:00Z main card lands on the previous UTC day. Ask for prev day..day. */
    const d=new Date(Date.UTC(+dateStr.slice(0,4),+dateStr.slice(4,6)-1,+dateStr.slice(6,8)));
    const prev=ymd(new Date(d.getTime()-864e5).toISOString());
    const r=await fetch(ESPN_URL+"?dates="+prev+"-"+dateStr+"&_="+Date.now(),{cache:"no-store",signal:ctrl.signal});
    clearTimeout(t);
    if(!r.ok) throw new Error("http "+r.status);
    const data=await r.json();
    if(id&&data.events&&data.events.length>1){
      const hit=data.events.filter(e=>String(e.id)===String(id));
      if(hit.length) data.events=hit;
    }
    if(!data.events||!data.events.length) throw new Error("no events");
    view="event"; browsing=true; lastFetch=Date.now();
    render(data,true,true);
  }catch(e){
    app.innerHTML='<div class="empty">Could not load that card. In Snapshot mode the sandbox blocks ESPN; open this file in Safari or host it, then event detail works.</div>'
      +'<button class="refresh" onclick="renderUpcoming()">Back to upcoming</button>';
  }
}
function pickEvent(data){
  const evs=(data&&data.events)||[];
  if(!evs.length) return null;
  const now=Date.now();
  let best=evs[0],bestD=Infinity;
  for(const e of evs){
    const d=Math.abs(new Date(e.date).getTime()-now);
    if(d<bestD){bestD=d;best=e;}
  }
  return best;
}
function orderedFights(ev){
  let fights=(ev.competitions||[]).slice();
  fights.sort((a,b)=>new Date(a.date)-new Date(b.date) || 0);
  /* if the 5-round main event leads the list, feed is main-event-first: reverse */
  const p=f=>(f.format&&f.format.regulation&&f.format.regulation.periods)||3;
  if(fights.length>1 && p(fights[0])===5 && p(fights[fights.length-1])!==5) fights.reverse();
  return fights;
}
function fightRow(f, cls, mainCardStart){
  const [a,b]=names(f);
  const wc=(f.type&&f.type.abbreviation)||"";
  const st=state(f);
  const od=oddsFor(a.name,b.name);
  const rounds=(f.format&&f.format.regulation&&f.format.regulation.periods)||3;
  let meta2="";
  if(st==="in"){
    const rd=f.status&&f.status.period?("R"+f.status.period):"";
    const ck=(f.status&&f.status.displayClock&&f.status.displayClock!=="-")?(" · "+f.status.displayClock):"";
    meta2='<span class="tag-live">Live '+esc(rd)+esc(ck)+"</span>";
  } else if(st==="pre"){
    meta2='<span>'+(cls&&cls.indexOf("next")===0?'<span class="tag-next">Next</span> · ':"")
      +(f._eta?('<span class="eta">est ~'+esc(etaTime(f._eta))+'</span>'):esc(localTime(f.date)))+"</span>";
  } else {
    meta2="<span>Final</span>";
  }
  let html='<div class="fight '+cls+'">'
    +'<div class="rail"><div class="node"></div></div>'
    +'<div class="fbody">'
    +'<div class="fmeta"><span class="wc">'+esc(wc)+(rounds===5?" · 5RD":"")+'</span>'+meta2+'</div>';
  const ini=n=>n.split(" ").filter(Boolean).map(w=>w[0]).slice(0,2).join("").toUpperCase();
  const dv=od?devig(od.a,od.b):null;
  const oddsTag=(o,other,p)=>{
    if(o==null) return "";
    const fav=o<other, pick=o===other?"pick":(fav?"fav":"dog");
    const lbl=pick==="pick"?"pick":(fav?"fav":"dog");
    return '<span class="fodds '+pick+'"><span class="lbl">'+lbl+'</span> '+esc(fmtOdds(o))
      +(p!=null?'<span class="fprob">'+esc(pctText(p))+'</span>':"")+'</span>';
  };
  const side=(x,pos,o,other)=>'<div class="corner '+pos+' '+(st==="post"?(x.winner?"won":"lost"):"")+'">'
      +'<div class="headshot"><span class="ini">'+esc(ini(x.name))+'</span>'
      +(x.pic?'<img src="'+esc(x.pic)+'" alt="" referrerpolicy="no-referrer" onerror="this.style.display=\'none\'">':"")
      +'</div>'
      +'<span class="fname">'+esc(x.name)+'</span><span class="frec">'+esc(x.rec)+'</span>'
      +oddsTag(o,other,dv?(pos==="left"?dv.a:dv.b):null)+'</div>';
  let mid="vs";
  if(st==="post") mid=a.winner?"&#9664;":"&#9654;";
  html+='<div class="vsrow">'+side(a,"left",od?od.a:null,od?od.b:null)+'<div class="vsmid">'+mid+'</div>'+side(b,"right",od?od.b:null,od?od.a:null)+'</div>';
  if(st==="post"){
    const det=(f.status&&f.status.type&&(f.status.type.detail||f.status.type.description))||"Final";
    const rd=f.status&&f.status.period?(" · R"+f.status.period):"";
    const ck=(f.status&&f.status.displayClock&&f.status.displayClock!=="-")?(" "+f.status.displayClock):"";
    html+='<div class="result">'+esc(det)+esc(rd)+esc(ck)+'</div>';
    const w=a.winner?a:b, l=a.winner?b:a;
    const q=encodeURIComponent('"'+w.name+'" "'+l.name+'" filter:videos');
    html+='<div class="cliplinks"><a href="https://x.com/search?q='+q+'&amp;f=video&amp;src=typed_query" target="_blank" rel="noopener">Clip &#8599;</a></div>';
  }
  html+='</div></div>';
  return html;
}
function cageMin(f){
  const p=(f.status&&f.status.period)||0;
  if(!p) return null;
  const ck=(f.status&&f.status.displayClock)||"";
  const m=ck.match(/^(\d+):(\d+)$/);
  const inRound=m?((+m[1])+(+m[2])/60):5;
  return (p-1)*5+inRound;
}
function assignEtas(done, now, pre){
  const cages=done.map(cageMin).filter(x=>x!=null);
  // observed pace once fights are in the books, otherwise a typical ~9min cage time
  const avg=cages.length?cages.reduce((a,b)=>a+b,0)/cages.length:9;
  const perFight=(avg+10)*60000; // cage time + walkouts, replays, interviews
  if(!done.length&&!now.length){
    // Nothing has happened yet, so pace forward from each block's scheduled start.
    // orderedFights() hands us running order already (opener first, main event last).
    const byDate={};
    pre.forEach(f=>{(byDate[f.date]=byDate[f.date]||[]).push(f);});
    Object.keys(byDate).forEach(d=>{
      const start=Date.parse(d);
      if(isNaN(start)){ byDate[d].forEach(f=>{delete f._eta;}); return; }
      byDate[d].forEach((f,i)=>{f._eta=start+i*perFight;});
    });
    return;
  }
  let base=Date.now();
  if(now.length){
    // remaining cage time for the live fight (at least a couple of minutes) + turnaround
    const el=cageMin(now[0])||0;
    base+=(Math.max(avg-el,2)+10)*60000;
  }
  // Pace forward from the live fight. A later block cannot open before its scheduled
  // time, so when we run early we push the whole remaining run back by that gap --
  // shifting rather than clamping, so fights never pile up on one timestamp.
  let shift=0, seen={};
  pre.forEach((f,i)=>{
    const est=base+i*perFight+shift;
    const start=Date.parse(f.date);
    if(!isNaN(start)&&!seen[f.date]){
      seen[f.date]=1;
      if(start>est) shift+=start-est; // block opener sets the floor for everything after
    }
    f._eta=base+i*perFight+shift;
  });
}
function etaTime(ms){return new Date(ms).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});}
let lastData=null, lastLive=false;
function render(data, isLive, browsing){
  lastData=data; lastLive=isLive;
  harvestCalendar(data);
  const ev=pickEvent(data);
  const app=document.getElementById("app");
  if(!ev){
    renderUpcoming();
    return;
  }
  document.getElementById("evName").textContent=ev.name||"UFC";
  const v=(ev.venues&&ev.venues[0])||(ev.competitions&&ev.competitions[0]&&ev.competitions[0].venue)||null;
  document.getElementById("evVenue").textContent=v?(v.fullName+(v.address&&v.address.city?(" · "+v.address.city):"")):"";
  const fights=orderedFights(ev);
  const dates=[...new Set(fights.map(f=>f.date))].sort();
  const mainCardStart=dates.length>1?dates[dates.length-1]:null;
  document.getElementById("evMain").innerHTML=mainCardStart
    ? "Main card <b>"+esc(localTime(mainCardStart))+"</b> · "+esc(localDay(mainCardStart))
    : "Starts <b>"+esc(localTime(ev.date))+"</b> · "+esc(localDay(ev.date));
  const now=fights.filter(f=>state(f)==="in");
  const pre=fights.filter(f=>state(f)==="pre");
  const done=fights.filter(f=>state(f)==="post").reverse();
  // per-fight estimates still drive the "est ~" time on each row
  assignEtas(done,now,pre);
  setNav("Upcoming", "renderUpcoming");
  let html="";
  if(!isLive && !done.length && !now.length){
    html+='<div class="empty">Snapshot was taken before the first fight, so no results exist in this data. Winners, result lines and clip links appear once the app has a live feed and fights go final. Open this file in Safari or host it to go live.</div>';
  }
  const total=pre.length+now.length+done.length;
  if(total){
    // Segment per start time. Groups run earliest -> latest; the LAST is always the
    // main card. Earlier groups are named from the end so a 3-block card reads
    // early prelims / prelims / main card, and a 2-block card reads prelims / main card.
    // Fight Nights sometimes ship only early prelims + prelims (no 5-rounder in the
    // last block); in that case shift the names down one so nothing is called a main card.
    const segOf={};
    const multi=dates.length>1;
    {
      const has5=d=>fights.some(f=>f.date===d&&((f.format&&f.format.regulation&&f.format.regulation.periods)||3)===5);
      // the closing block is a real main card if it has a 5-round fight, or if it is
      // the only block, or if no block has one (data missing rounds -> assume normal card)
      const last=dates[dates.length-1];
      const mainIsLast=dates.length<2||has5(last)||!dates.some(has5);
      const ladder=["Main card","Prelims","Early prelims"];
      const clsLadder=["seg-main","seg-prelim","seg-early"];
      const offset=mainIsLast?0:1; // no main card present -> everything is a prelim block
      dates.slice().reverse().forEach((d,i)=>{
        const k=Math.min(i+offset,ladder.length-1);
        segOf[d]={label:ladder[k],cls:clsLadder[k]};
      });
    }
    html+='<div class="section-label">Card · '+done.length+' of '+total+' done</div>';
    const seq=[];
    const list=pre.slice().reverse();
    list.forEach((f,i)=>seq.push([f, i===list.length-1?"next":""]));
    now.forEach(f=>seq.push([f,"now"]));
    done.forEach(f=>seq.push([f,"done"]));
    let lastSeg=null;
    seq.forEach(([f,cls])=>{
      const seg=segOf[f.date]||{label:"",cls:""};
      if(multi&&seg.label!==lastSeg){
        html+='<div class="segmark '+seg.cls+'"><div class="rail"><div class="tick"></div></div><div class="seglabel">'+esc(seg.label)+'</div></div>';
        lastSeg=seg.label;
      }
      html+=fightRow(f, cls+(seg.cls?" "+seg.cls:""), mainCardStart);
    });
  }
  if(!now.length&&!pre.length&&!done.length){
    html+='<div class="empty">Card is empty.</div>';
  }
  app.innerHTML=html;
}
async function load(){
  try{
    const ctrl=new AbortController();
    const t=setTimeout(()=>ctrl.abort(),6000);
    const r=await fetch(ESPN_URL+"?_="+Date.now(),{cache:"no-store",signal:ctrl.signal});
    clearTimeout(t);
    if(!r.ok) throw new Error("http "+r.status);
    const data=await r.json();
    liveMode=true;
    harvestCalendar(data);
    if(view==="event"&&!browsing){ lastFetch=Date.now(); render(data,true); }
  }catch(e){
    liveMode=false;
    if(view==="event"&&!browsing){ lastFetch=lastFetch||Date.now(); render(SNAPSHOT,false); }
  }
  if(timer) clearInterval(timer);
  if(liveMode) timer=setInterval(load,POLL_MS);
}
load();
loadOdds();
/* re-render every minute so ETAs move; browsing flag preserved so the Back button survives */
setInterval(function(){ if(view==="event"&&lastData) render(lastData,lastLive,browsing); },60000);
/* home-screen app: timers pause in the background, so refresh the moment it's reopened */
document.addEventListener("visibilitychange",function(){
  if(document.visibilityState==="visible"&&!browsing){ load(); loadOdds(); }
});
</script>
